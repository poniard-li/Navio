services:
  themes:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 17896
      DATA_DIR: /data
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?Set a publishing token with at least 32 characters}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a different administrator token with at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:17896:17896"
    volumes:
      - dex-themes-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:17896/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  dex-themes-data:
