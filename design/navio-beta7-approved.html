#navio-next-preview .n-brandname {
  font-family: "Navio Wordmark", "Nunito", "Arial Rounded MT Bold", "Segoe UI Variable Display", "Segoe UI", sans-serif;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -.65px;
  color: var(--n-text);
  font-kerning: normal;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

#navio-next-preview[data-material="liquid"] {
  --ng-light-x: 12%;
  --ng-light-y: 0%;
  --ng-edge: light-dark(#ffffffc7, #d8edff3d);
  --ng-edge-soft: light-dark(#a9c0d046, #b8d5ef17);
  --ng-inner-edge: light-dark(#ffffffde, #e3f1ff1f);
  --ng-low-edge: light-dark(#7895aa24, #00000038);
  --ng-shadow: light-dark(#203c5514, #00000032);
  --ng-shadow-deep: light-dark(#203c5526, #00000066);
  --ng-glint: light-dark(#ffffffc2, #d9edff20);
  --ng-glint-faint: light-dark(#ffffff30, #ffffff05);
  --ng-sidebar: color-mix(in srgb, var(--mt-glass, var(--n-side)) 72%, transparent);
  --ng-chrome: color-mix(in srgb, var(--mt-glass, var(--n-top)) 77%, transparent);
  --ng-float: color-mix(in srgb, var(--n-panel) 89%, transparent);
  --ng-selected: color-mix(in srgb, var(--n-accent) 11%, light-dark(#ffffffa8, #55759440));
  --ng-hover: light-dark(#ffffff80, #d4e9ff10);
  --ng-track: light-dark(#dde7ee9c, #07121b47);
}

#navio-next-preview[data-material="liquid"] .n-sidebar {
  background:
    radial-gradient(ellipse at var(--ng-light-x) var(--ng-light-y), var(--ng-glint) 0, transparent 64%),
    linear-gradient(150deg, var(--ng-glint-faint), transparent 45%, var(--ng-glint-faint)),
    var(--ng-sidebar);
  -webkit-backdrop-filter: blur(28px) saturate(148%);
  backdrop-filter: blur(28px) saturate(148%);
  border-right-color: var(--ng-edge-soft);
  box-shadow:
    inset 1px 0 0 var(--ng-inner-edge),
    inset -1px 0 0 var(--ng-edge),
    inset 0 1px 0 var(--ng-inner-edge),
    5px 0 18px var(--ng-shadow);
}

#navio-next-preview[data-material="liquid"] .n-chrome {
  background:
    linear-gradient(178deg, var(--ng-glint), transparent 48%),
    var(--ng-chrome);
  -webkit-backdrop-filter: blur(28px) saturate(148%);
  backdrop-filter: blur(28px) saturate(148%);
  border-bottom-color: var(--ng-edge-soft);
  box-shadow: inset 0 1px 0 var(--ng-inner-edge), inset 0 -1px 0 var(--ng-low-edge);
  color: var(--n-text);
}

#navio-next-preview[data-material="liquid"] .n-content {
  background: var(--n-bg);
}

#navio-next-preview[data-material="liquid"] .n-searchbutton {
  background: light-dark(#ffffff54, #03111d35);
  border-color: var(--ng-edge-soft);
  border-radius: 9px;
  box-shadow: inset 0 1px 1px var(--ng-low-edge), 0 1px 0 var(--ng-inner-edge);
  color: var(--n-muted);
}

#navio-next-preview[data-material="liquid"] .n-sidebar .n-nav {
  border-radius: 10px;
  color: var(--n-text);
  transition: background-color 160ms ease, box-shadow 160ms ease, color 160ms ease;
}

#navio-next-preview[data-material="liquid"] .n-sidebar .n-nav:not([aria-current="page"]):hover {
  background: var(--ng-hover);
  box-shadow: inset 0 1px 0 var(--ng-inner-edge);
}

#navio-next-preview[data-material="liquid"] .n-sidebar .n-nav[aria-current="page"],
#navio-next-preview[data-material="liquid"] .r-groupmenu .n-nav[aria-current="page"] {
  background:
    linear-gradient(173deg, var(--ng-glint), transparent 48%),
    var(--ng-selected);
  -webkit-backdrop-filter: blur(13px) saturate(140%);
  backdrop-filter: blur(13px) saturate(140%);
  box-shadow:
    inset 0 1px 0 var(--ng-edge),
    inset 1px 0 0 var(--ng-inner-edge),
    inset 0 -1px 0 var(--ng-low-edge),
    0 2px 5px var(--ng-shadow);
  color: var(--n-text);
}

#navio-next-preview[data-material="liquid"] .n-sidebar .n-nav[aria-current="page"] svg {

}

#navio-next-preview[data-material="liquid"] .n-sidecontrols,
#navio-next-preview[data-material="liquid"] .n-children {
  border-color: var(--ng-edge-soft);
}

#navio-next-preview[data-material="liquid"] .n-sidecontrols .n-modes {
  background: var(--ng-track);
  box-shadow: inset 0 1px 2px var(--ng-low-edge), 0 1px 0 var(--ng-inner-edge);
}

#navio-next-preview[data-material="liquid"] .n-sidecontrols .n-modes button[aria-pressed="true"] {
  background: linear-gradient(170deg, var(--ng-glint), transparent 58%), var(--ng-selected);

#navio-next-preview[data-material="liquid"] .n-dialoglayer {

#navio-next-preview[data-material="liquid"] .n-dialoglayer.menu {

#navio-next-preview[data-material="liquid"] .n-dialog {
  background:
    radial-gradient(ellipse at var(--ng-light-x) var(--ng-light-y), var(--ng-glint), transparent 58%),
    linear-gradient(153deg, var(--ng-glint-faint), transparent 40%),
    var(--ng-float);
  -webkit-backdrop-filter: blur(34px) saturate(145%);
  backdrop-filter: blur(34px) saturate(145%);
  border-color: var(--ng-edge-soft);
  box-shadow:
    inset 0 1px 0 var(--ng-edge),
    inset 1px 0 0 var(--ng-inner-edge),
    inset -1px 0 0 var(--ng-edge-soft),
    inset 0 -1px 0 var(--ng-low-edge),
    0 16px 45px var(--ng-shadow-deep),
    0 2px 6px var(--ng-shadow);
  color: var(--n-text);
}

#navio-next-preview[data-material="liquid"] .drawer .n-dialog {
  box-shadow:
    inset 1px 0 0 var(--ng-edge),
    inset 2px 0 0 var(--ng-inner-edge),
    -8px 0 28px var(--ng-shadow-deep);
}

#navio-next-preview[data-material="liquid"] .n-dialoghead,
#navio-next-preview[data-material="liquid"] .n-dialogfoot {
  border-color: var(--ng-edge-soft);
}

#navio-next-preview[data-material="liquid"] .mt-tabs,
#navio-next-preview[data-material="liquid"] .ga-tabs {
  background: var(--ng-track);
  border: 1px solid var(--ng-edge-soft);
  border-radius: 13px;
  padding: 4px;
  box-shadow: inset 0 1px 2px var(--ng-low-edge), 0 1px 0 var(--ng-inner-edge);
  -webkit-backdrop-filter: blur(18px) saturate(135%);
  backdrop-filter: blur(18px) saturate(135%);
}

#navio-next-preview[data-material="liquid"] .mt-tabs .n-tab,
#navio-next-preview[data-material="liquid"] .ga-tabs > button {

    inset 1px 0 0 var(--ng-inner-edge),

#navio-next-preview[data-material="liquid"] .mt-tabs .n-tab:not([aria-selected="true"]):hover,

<script>
(()=>{
const root=document.getElementById('navio-next-preview');
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const selectField=(label,key,value,options)=>`<label class="n-field">${label}<select data-field="${h(key)}">${options.map(([v,l])=>`<option value="${h(v)}" ${String(value)===String(v)?'selected':''}>${h(l)}</option>`).join('')}</select></label>`;

const configIds=['overrides','dns','sniffer','resources','substore','migration','backup'];const networkIds=['sysproxy','tun','core','network'];
const pmap=Object.fromEntries(pages.map(p=>[p[0],p]));

function modes(){return integratedBypassModes();}
function nav(id){const p=pmap[id];return `<button type="button" class="n-nav cursor-interaction" data-action="go" data-value="${id}" aria-label="${p[1]}" data-tooltip="${p[1]}" ${S.page===id?'aria-current="page"':''}>${icon(p[2])}<span>${p[1]}</span></button>`;}
function sidebar(){return `<aside class="n-sidebar" ${S.modal?'inert':''}><div class="n-brand"><span class="n-brandmark">N</span><span class="n-brandname">Navio</span>${ib('panel-left','collapse',S.collapsed?'展开侧栏':'收起侧栏')}</div><button type="button" class="n-searchbutton cursor-interaction" data-action="search" aria-label="搜索全部功能">${icon('search')}<span>搜索全部功能</span><kbd>Ctrl K</kbd></button>${pages.slice(0,8).map(p=>nav(p[0])).join('')}<button type="button" class="n-nav n-group cursor-interaction" data-action="group" data-value="config" aria-label="配置与资源" aria-expanded="${S.groupConfig}">${icon('layers')}<span>配置与资源</span>${icon(S.groupConfig?'chevron-down':'chevron-right')}</button>${S.groupConfig?`<div class="n-children">${configIds.map(nav).join('')}</div>`:''}<button type="button" class="n-nav n-group cursor-interaction" data-action="group" data-value="network" aria-label="网络与内核" aria-expanded="${S.groupNetwork}">${icon('cpu')}<span>网络与内核</span>${icon(S.groupNetwork?'chevron-down':'chevron-right')}</button>${S.groupNetwork?`<div class="n-children">${networkIds.map(nav).join('')}</div>`:''}<div class="n-sidegap"></div><div class="n-sidecontrols"><button type="button" class="n-config cursor-interaction" data-action="go" data-value="profiles">${icon('folder')}<span class="n-muted"><small>当前配置</small><strong>${h(S.profiles.find(p=>p.active)?.name||'日常订阅')}.yaml</strong></span></button><div class="n-sidelabel"><span>出站模式</span><button type="button" class="cursor-interaction" data-action="interface">${S.interfaceMode==='standard'?'标准模式':'简易模式'} ${icon('chevron-down')}</button></div>${modes()}<label class="n-toggleline"><span>${icon('globe')}系统代理</span><input class="n-switch cursor-interaction" type="checkbox" data-field="proxy" ${S.proxy?'checked':''} aria-label="系统代理"></label><label class="n-toggleline"><span>${icon('monitor')}TUN</span><input class="n-switch cursor-interaction" type="checkbox" data-field="tun" ${S.tun?'checked':''} aria-label="TUN"></label></div><div class="n-sidefoot">${['account','themes','settings','help'].map(nav).join('')}</div></aside>`;}

function home(){const n=nodes.find(n=>n.id===S.node);return `<div class="n-heading"><div><div class="n-eyebrow">NAVIO / WORKSPACE</div><h1>连接，就在眼前。</h1></div><span class="n-good"><small><span class="n-dot"></span> ${S.proxy||S.tun?'已接入':'未连接'}</small></span></div><section class="n-panel n-hero"><div class="n-herohead"><div><div class="n-caption">当前连接</div><div class="n-status">${S.proxy?'系统代理已开启':S.tun?'TUN已开启':'准备好，开始连接'}</div><p class="n-sub">${S.proxy?'跟随系统代理的应用已接入，按所选模式分流。':S.tun?'进入TUN的流量，按所选模式分流。':'连接后，跟随系统代理的应用将接入当前配置。'}</p></div><button type="button" class="n-power cursor-interaction ${!S.proxy&&!S.tun?'off':''}" data-action="connect" aria-label="${S.proxy||S.tun?'断开连接':'开始连接'}">${icon('power')}<span>${S.proxy||S.tun?'断开':'连接'}</span></button></div><div class="n-herofoot">${modes()}<button type="button" class="n-link cursor-interaction" data-action="go" data-value="tun">TUN 设置 ${icon('arrow-up-right')}</button></div></section><button type="button" class="n-currentnode cursor-interaction" data-action="node-drawer"><span class="n-nodeglyph">${icon('wifi')}</span><span><small>当前策略组 · ${h(S.group)}</small><strong>${h(n.name)} <span class="n-latency">${S.badNode?'连接异常':n.ms+' ms'}</span></strong></span><span class="n-link">选择节点 ${icon('chevron-right')}</span></button>${S.badNode?note('当前节点不可用。'+btn('选择可用节点','recommend','','primary')):''}<div class="n-traffic"><div class="n-metric"><small>${icon('arrow-down')}下载</small><strong>${S.proxy||S.tun?'8.42':'0'}<span>MB/s</span></strong></div><div class="n-metric"><small>${icon('arrow-up')}上传</small><strong>${S.proxy||S.tun?'626':'0'}<span>KB/s</span></strong></div>${spark()}</div><section class="n-homebottom">${row(h(S.profiles.find(p=>p.active)?.name||'日常订阅'),'剩余 128 GB / 200 GB · 还有 24 天到期',`<button type="button" class="n-link cursor-interaction" data-action="go" data-value="profiles">管理订阅 ${icon('arrow-up-right')}</button>`)}<div class="n-meter" aria-label="已使用 36%"><span style="width:36%"></span></div></section><div class="n-quietstrip"><span class="n-good"><span class="n-dot"></span> 内核运行中</span><span>${S.tun?'TUN 已开启':'TUN 未开启'}</span><span>${S.offline?'账号离线':'账号已登录'}</span><button type="button" class="n-link cursor-interaction" data-action="go" data-value="network">网络信息 ${icon('chevron-right')}</button></div>`;}
function nodeList(){const list=nodes.filter(n=>M.members[S.group].includes(n.id)&&(!S.onlyFavorites||S.favorite.includes(n.id))&&(n.name+n.type+n.region).toLowerCase().includes(S.nodeQuery.toLowerCase())).sort((a,b)=>M.sort==='latency'?a.ms-b.ms:M.sort==='favorite'?(S.favorite.includes(b.id)-S.favorite.includes(a.id)):0);return list.length?`<div class="n-nodegrid">${list.map(n=>`<div class="n-node ${n.id===S.node?'chosen':''}"><button type="button" class="n-nodepick cursor-interaction" data-action="node-pick" data-value="${n.id}" aria-label="选择 ${n.name}"><span class="n-region">${n.region}</span><span><strong>${n.name}</strong><small>${n.type}</small></span></button><span class="n-latency">${n.ms} ms</span><button type="button" class="n-icon n-star cursor-interaction ${S.favorite.includes(n.id)?'active':''}" data-action="favorite" data-value="${n.id}" aria-label="${S.favorite.includes(n.id)?'取消收藏':'收藏'} ${n.name}">${icon('star')}</button></div>`).join('')}</div>`:`<div class="n-empty">没有匹配的节点</div>`;}

if(p==='profiles')return heading('订阅管理','本地修改独立保存，更新订阅时继续应用。',btn(icon('plus')+' 导入订阅','profile-add','','primary'))+S.profiles.map(x=>panel('',row(h(x.name),x.active?'正在使用 · 24 天后到期':'备用配置 · 尚未启用',badge(x.active?'当前配置':'订阅'))+row('128 GB / 200 GB','上次更新：今天 10:24',`<div class="n-actions">${!x.active?btn('使用','profile-use',x.id):''}${btn('更新','profile-update',x.id)}${btn('编辑','profile-edit',x.id)}${ib('more-horizontal','profile-more','更多操作',x.id)}</div>`))).join('')+note('订阅地址与节点凭据仅保存在本机。D.E.X 账号不会同步这些内容。');
if(p==='connections'){const c=filteredConnections();return heading('连接',`${S.connections.length} 个活动连接 · 示例流量`,btn('关闭全部','connections-clear','','danger'))+field('筛选应用、域名或策略','connectionQuery',S.connectionQuery)+`<div id="n-connections">${connectionsTable(c)}</div>`;}

function advancedField(key,value,el) {
  if(!key.startsWith('adv-'))return false;
  const name=key.slice(4), val=el?.type==='checkbox'?!!el.checked:value;
  if(name.startsWith('backup-')){const id=name.slice(7);A.backupSelected=val?[...new Set([...A.backupSelected,id])]:A.backupSelected.filter(x=>x!==id);}
  else if(name.startsWith('external-')){const id=name.slice(9);A.externalSelected=val?[...new Set([...A.externalSelected,id])]:A.externalSelected.filter(x=>x!==id);}
  else if(['resourceName','resourceURL','resourceType','script','backupPassword','restorePassword'].includes(name)) A.draft[name]=val;
  else if(Object.hasOwn(advDefaults,name)||['dnsFilter','dnsPolicy','dnsHosts','dnsUseHosts','dnsSystemHosts','tunExclude','tunExcludeInterface','httpPort','bindAddress','coreIPv6','coreInterface','controllerAddress','allowIPs','denyIPs','coreAuthentication','processMode','coreLogLevel','tcpConcurrent','tcpKeepAlive','unifiedDelay','storeSelected','storeFakeIP'].includes(name)) S.cfg[name]=val;
  else A[name]=val;
  if(name==='systemProxy'){S.proxy=!!val;render();}
  if(name==='tunEnabled'){S.tun=!!val;render();}
  if(name==='hideIP'){render();}
  if(name==='overlayCode')A.overlaySaved=false;
  return true;
}

else if(a==='rv-group'){S.group=v;if(!M.members[v].includes(S.node))S.node=M.members[v][0];render();}
else if(a==='rv-pick'){if(S.badNode&&S.node===v){toast('此节点当前不可用，请测试后再选择。');return true;}S.node=v;S.badNode=false;if(S.modal?.type==='revisionNodes')closeModal();else render();toast('已选择 '+nodes.find(n=>n.id===v).name+'（模拟）。');}
else if(a==='rv-favorite'){S.favorite=S.favorite.includes(v)?S.favorite.filter(x=>x!==v):[...S.favorite,v];revisionRefreshNodes();}
else if(a==='rv-filter'){RV.nodeFilter=v;if(S.modal?.type==='revisionNodes')revisionDrawer();else render();}
else if(a==='rv-reset-filter'){RV.nodeQuery='';RV.nodeFilter='all';if(S.modal?.type==='revisionNodes')revisionDrawer();else render();}

else if(a==='rv-failure'){S.badNode=true;closeModal();}

function bpState(){
 if(!S.bp||S.bp.schema!==1)S.bp={schema:1,enabled:false,category:'common',search:'',onlyEnabled:false,selected:[],overrides:{},custom:[],tab:'presets',bulk:[],revision:1,updatePreview:false,draft:null};
 return S.bp;
}
function integratedBypassStatus(){
 const b=bpState(),selectedCount=bpCatalogue.filter(a=>b.selected.includes(a.id)).length+b.custom.filter(a=>a.enabled&&(a.processes.length||a.domains.length)).length;
 const active=b.enabled&&selectedCount>0&&S.mode==='global',effectiveCount=active?selectedCount:0;
 const label=!b.enabled?'已关闭':active?'全局模式生效':'已开启 · 当前不生效';
 const detail=!b.enabled?`已选择 ${selectedCount} 项 · 关闭后保留选择`:S.mode==='rule'?'规则模式按原有规则分流，例外不参与匹配':S.mode==='direct'?'直连模式直接联网，例外不参与匹配':`${effectiveCount} 项例外用于全局模式`;
 return {enabled:b.enabled,selectedCount,effectiveCount,mode:S.mode,active,label,detail};
}
function bpSync(){
 const b=bpState();if(b.enabled&&!integratedBypassStatus().selectedCount)b.enabled=false;
 const active=integratedBypassStatus().active;
 S.bypass=active?bpCatalogue.filter(x=>b.selected.includes(x.id)).map(x=>bpApp(x.id).name):[];
 S.customBypass=active?b.custom.filter(x=>x.enabled).flatMap(x=>[...x.processes.map(value=>({type:'进程名',value})),...x.domains.map(value=>({type:'域名后缀',value}))]):[];
}

function integratedBypassSnapshot(){const b=bpState();return {version:1,enabled:b.enabled,selected:[...b.selected],custom:b.custom.map(a=>({id:a.id,name:a.name,enabled:a.enabled,processes:[...a.processes],domains:[...a.domains]})),overrides:Object.fromEntries(Object.entries(b.overrides).map(([id,a])=>[id,{name:a.name,processes:[...a.processes],domains:[...a.domains]}])),revision:b.revision};}
function integratedBypassRestore(snapshot){
 const current=S.bp?.schema===1?S.bp:null;
 const view=current?Object.fromEntries(['category','search','onlyEnabled','tab','bulk','bulkScope','updatePreview','draft'].filter(key=>current[key]!==undefined).map(key=>[key,current[key]])):null;
 S.bp=null;const b=bpState();if(view)Object.assign(b,view);
 if(snapshot?.version===1){
  const validIds=new Set(bpCatalogue.map(a=>a.id));
  const cleanRule=a=>{if(!a||typeof a.name!=='string'||!a.name.trim())return null;const processes=Array.isArray(a.processes)?[...new Set(a.processes.filter(x=>typeof x==='string'&&x.trim()&&!/[\\/\r\n]/.test(x)).map(x=>x.trim()))]:[],domains=Array.isArray(a.domains)?[...new Set(a.domains.filter(x=>typeof x==='string'&&x.includes('.')&&!/[:/\s]/.test(x)))]:[];return processes.length||domains.length?{name:a.name.trim(),processes,domains}:null;};
  b.selected=[...new Set((Array.isArray(snapshot.selected)?snapshot.selected:[]).filter(id=>validIds.has(id)))];
  const seen=new Set();
  for(const a of Array.isArray(snapshot.custom)?snapshot.custom:[]){const rule=cleanRule(a);if(rule&&typeof a.id==='string'&&/^custom-[a-zA-Z0-9-]+$/.test(a.id)&&!seen.has(a.id)){seen.add(a.id);b.custom.push({id:a.id,...rule,enabled:a.enabled===true});}}
  for(const [id,a] of Object.entries(snapshot.overrides&&typeof snapshot.overrides==='object'?snapshot.overrides:{})){const rule=cleanRule(a);if(validIds.has(id)&&rule)b.overrides[id]=rule;}
  b.revision=snapshot.revision===2?2:1;b.enabled=snapshot.enabled===true;
 }
 bpSync();
}

function bypassField(key,value,el){if(!key.startsWith('bp-'))return false;const b=bpState();if(key==='bp-search'){b.search=value;bpUpdateList();}else if(key==='bp-category'){b.category=value;render();}else if(key==='bp-enabled'){b.onlyEnabled=Boolean(value);bpUpdateList();}else if(key.startsWith('bp-toggle:')){bpSet(key.slice(10),Boolean(value));render();}else if(key.startsWith('bp-custom-toggle:')){const a=b.custom.find(x=>x.id===key.slice(17));if(a)a.enabled=Boolean(value);bpSync();render();}else if(key.startsWith('bp-bulk:')){const id=key.slice(8);b.bulk=value?[...new Set([...b.bulk,id])]:b.bulk.filter(x=>x!==id);}else if(key.startsWith('bp-draft.')){b.draft[key.slice(9)]=value;}else return false;return true;}

function obBytes(value){if(value>=1e9)return (value/1e9).toFixed(2)+' GB';if(value>=1e6)return (value/1e6).toFixed(value>=1e8?0:1)+' MB';if(value>=1000)return (value/1000).toFixed(1)+' KB';return value+' B';}

function obTreeData(){const tree={id:'root',type:'root',name:'连接',children:[],connections:[],total:0};for(const c of obLiveConnections()){tree.connections.push(c);tree.total+=c.upload+c.download;let branch=tree;for(const [type,name] of [['group',c.group],['proxy',c.proxy],['rule',c.rule],['sourceIP',c.sourceIP],['port',c.port]]){const id=branch.id+'|'+type+':'+name;let n=branch.children.find(n=>n.id===id);if(!n){n={id,type,name,children:[],connections:[],total:0};branch.children.push(n);}n.connections.push(c);n.total+=c.upload+c.download;branch=n;}}return tree;}

function obTopology(){const list=obLiveConnections(),tree=obTreeData();return `<section class="ob-netcard ob-topology"><div class="ob-sectionhead"><div><h3>${icon('network')} 网络拓扑</h3><p class="n-muted">${new Set(list.map(c=>c.sourceIP)).size} 个来源 · ${new Set(list.map(c=>c.group)).size} 个策略组 · ${list.length} 条连接</p></div>${obActions(btn(OB.networkPaused?'继续更新':'暂停更新','ob-network-pause'),btn('展开全部','ob-tree-expand'))}</div><div class="ob-topologylegend">${Object.entries(obTreeLabels).map(([key,label])=>`<span>${icon(obTreeIcons[key])}${label}</span>`).join('<span class="ob-legend-arrow">→</span>')}</div>${tree.children.length?`<ul class="ob-tree">${tree.children.map(obTreeNode).join('')}</ul>`:'<div class="n-empty">暂无活动连接，连接建立后会显示路径。</div>'}<div class="ob-sectionfoot"><span>点节点展开下层；点信息图标查看连接明细。</span>${btn('模拟一条新连接','ob-network-append')}</div></section>`;}

let obChartObserver=null;
function obDrawChart(){const box=document.querySelector('#navio-next-preview #ob-chart');if(!box)return;const data=obTrafficData();if(!data.length){box.innerHTML='<div class="n-empty">当前范围没有流量记录</div>';return;}const series=obSeries(data),w=Math.max(140,Math.floor(box.getBoundingClientRect().width)),height=210,left=52,right=12,top=23,bottom=36,pw=Math.max(40,w-left-right),ph=height-top-bottom;const max=Math.max(1,...series.flatMap(p=>[p.upload,p.download]))*1.12,unit=max>=1e9?1e9:1e6,unitLabel=unit===1e9?'GB':'MB';const x=i=>left+pw*i/Math.max(1,series.length-1),y=n=>top+ph*(1-n/max);let svg=`<svg class="ob-chart-svg" viewBox="0 0 ${w} ${height}" width="${w}" height="${height}" role="img" aria-label="${h(obRanges[OB.range])}上传与下载流量，单位${unitLabel}"><text x="0" y="13" class="ob-axisunit">${unitLabel}</text>`;for(let i=0;i<4;i++){const value=max*i/3,yy=y(value);svg+=`<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" class="ob-gridline"/><text x="${left-8}" y="${yy+4}" text-anchor="end">${(value/unit).toFixed(value/unit<10?1:0)}</text>`;}const step=Math.ceil((series.length-1)/(w<350?2:4));series.forEach((p,i)=>{if(i%step===0||i===series.length-1)svg+=`<text x="${x(i)}" y="${height-12}" text-anchor="${i===0?'start':i===series.length-1?'end':'middle'}">${h(p.label)}</text>`;});for(const key of ['download','upload']){svg+=`<path class="ob-chartline ob-line-${key}" d="${series.map((p,i)=>(i?'L':'M')+x(i).toFixed(2)+' '+y(p[key]).toFixed(2)).join(' ')}"/>`;series.forEach((p,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(p[key])}" r="3" class="ob-point ob-point-${key}" data-tooltip="${h(p.label+' · 上传 '+obBytes(p.upload)+' · 下载 '+obBytes(p.download)+' · '+p.count+' 次会话')}"/>`;});}svg+='</svg>';box.innerHTML=svg;}

let mtInitialized = false;
let mtPreference = null;

function motionInit() {
  if (mtInitialized) return;
  mtInitialized = true;
  S.motion = { theme: 'cat', paused: false, intensity: 38, tab: 'collection', ...(S.motion || {}) };
  if (!MT_THEMES.some(t => t.id === S.motion.theme)) S.motion.theme = 'aurora';
  S.motion.intensity = Math.max(0, Math.min(100, Number(S.motion.intensity) || 0));
  mtPreference = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  mtPreference?.addEventListener('change', motionApply);
  document.addEventListener('visibilitychange', motionApply);
}

function mtPalette(theme) {

}

}

function motionScene() {
  motionInit();
  return `<div class="mt-scene" data-mt-scene="${S.motion.theme}" aria-hidden="true">${mtArtwork(S.motion.theme)}</div>`;
}

function mtPauseReason() {
  if (document.hidden) return 'hidden';
  if (mtPreference?.matches) return 'system';
  return S.motion.paused ? 'user' : '';
}

function motionApply() {
  motionInit();
  const theme = MT_THEMES.find(t => t.id === S.motion.theme) || MT_THEMES[0];
  const reason = mtPauseReason();
  root.dataset.mtTheme = theme.id;
  root.dataset.mtPaused = String(Boolean(reason));
  root.dataset.mtMotionReason = reason;
  for (const key of ['base', 'tint', 'tint2', 'glass', 'ink']) root.style.setProperty('--mt-' + key, theme[key]);
  root.style.setProperty('--mt-strength', String(S.motion.intensity / 100));
  const scene = root.querySelector('.n-window > .mt-scene');
  if (scene && scene.dataset.mtScene !== theme.id) {
    scene.dataset.mtScene = theme.id;
    scene.innerHTML = mtArtwork(theme.id);
  }
  const labels = { hidden: '窗口隐藏，动态已暂停', system: '跟随系统减少动态', user: '动态已暂停', '': '动态播放中' };
  root.querySelectorAll('[data-mt-status]').forEach(el => el.textContent = labels[reason]);
  root.querySelectorAll('[data-mt-strength-value]').forEach(el => el.textContent = S.motion.intensity + '%');
}

function motionAction(action, value, el) {
  if (!action.startsWith('mt-')) return false;
  motionInit();
  if (action === 'mt-select') {
    if (!MT_THEMES.some(t => t.id === value)) return true;
    S.motion.theme = value;
    render();
    toast('已应用「' + MT_THEMES.find(t => t.id === value).name + '」');
  } else if (action === 'mt-tab') {
    S.motion.tab = value === 'mine' ? 'mine' : 'collection';
    render();
  } else if (action === 'mt-pause') {
    S.motion.paused = !S.motion.paused;
    render();
    if (mtPreference?.matches && !S.motion.paused) toast('系统已开启减少动态，背景保持静止。');
  } else return false;
  if (typeof save === 'function') save();
  return true;
}

function motionField(key, value, el) {
  if (key !== 'mt-intensity') return false;
  motionInit();
  const intensity = Number(value);
  if (Number.isFinite(intensity)) S.motion.intensity = Math.max(0, Math.min(100, intensity));
  motionApply();
  if (typeof save === 'function') save();
  return true;
}

      <div class="ih-routegrid"><button type="button" class="ih-node cursor-interaction" data-action="node-drawer"><span class="ih-nodebody"><small>${S.mode === 'direct' ? '已选节点 · 直连模式不使用' : '当前节点 · ' + h(S.group)}</small><span class="ih-node-line"><strong>${h(node?.name || '选择节点')}</strong><span class="ih-latency ${S.badNode ? 'ih-warning' : ''}">${S.badNode ? '不可用' : (node?.ms ?? '—') + ' ms'}</span></span></span>${icon('chevron-right')}</button><div class="ih-routing"><div class="ih-modehead"><span>出站模式</span><button type="button" class="ih-modehelp cursor-interaction" data-action="rv-routing-help" aria-label="出站模式说明">${icon('circle-help')}</button></div>${modes()}</div></div>
      <div class="ih-bypass">${bypass}</div>
    </section>
    ${S.badNode ? `<div class="ih-warningbar">${icon('triangle-alert')}<span>当前节点不可用</span>${btn('选择可用节点', 'recommend')}</div>` : ''}

    <div class="ih-shortcuts"><button type="button" class="ih-shortcut cursor-interaction" data-action="go" data-value="tun">${icon('radio')}<span><strong>TUN</strong><small>${S.tun ? '已开启' : '未开启'} · 接管范围与后台服务</small></span>${icon('chevron-right')}</button><button type="button" class="ih-shortcut cursor-interaction" data-action="go" data-value="network">${icon('waypoints')}<span><strong>网络信息</strong><small>公网出口、连接路径与延迟</small></span>${icon('chevron-right')}</button></div>
  </div>`;
}

const FX_TRAY_STATES=[['off','未接管','系统代理与 TUN 均关闭'],['proxy','系统代理','系统代理开启'],['tun','TUN','TUN 开启'],['error','内核异常','需要检查内核或配置']];
function fxTrayStatus(){return S.cfg.coreStatus==='error'?'error':S.tun?'tun':S.proxy?'proxy':'off';}
function fxTrayImage(state,size=24){return `<img class="fx-tray-image" src="${FX_TRAY_ICONS[state]||FX_TRAY_ICONS.app}" width="${size}" height="${size}" alt="${state==='app'?'Navio 完整标志':'Navio '+FX_TRAY_STATES.find(s=>s[0]===state)?.[1]}"/>`;}
function fxTrayAction(action){if(action!=='tray'&&action!=='fx-tray-preview')return false;const current=fxTrayStatus();openModal('系统托盘',`<div class="fx-tray-current">${fxTrayImage(current,48)}<div><strong>Navio · ${FX_TRAY_STATES.find(s=>s[0]===current)[1]}</strong><p>收起窗口后，连接状态保持不变。</p></div></div><div class="fx-tray-variants">${FX_TRAY_STATES.map(([key,label,detail])=>`<div class="fx-tray-variant">${fxTrayImage(key,52)}<strong>${label}</strong><span>${detail}</span><div class="fx-tray-small">${fxTrayImage(key,16)}${fxTrayImage(key,20)}${fxTrayImage(key,24)}</div></div>`).join('')}</div><p class="fx-tray-note">底板、圆角和 N 字轮廓均沿用软件标志；仅 N 字颜色随状态变化。</p>`,btn('恢复窗口','close','','primary'));return true;}
function fxTrayAfterRender(){const brand=root.querySelector('.n-brandmark');if(brand&&!brand.querySelector('img'))brand.innerHTML=fxTrayImage('app',25);}

const NR={query:'',index:0,recent:[],pending:null,notifications:[],filter:'all',alert:null,flags:{}};
function nextDispatch(action,value=''){
  const b=document.createElement('button');b.type='button';b.dataset.action=action;b.dataset.value=value;b.hidden=true;root.append(b);b.click();b.remove();
}
function nextCommandCatalog(){
  const active=S.profiles.find(p=>p.active);
  const group=S.group==='自动选择'?'节点选择':S.group;
  const result=pages.map(p=>({id:'page:'+p[0],title:p[1],detail:p[3],kind:'功能',icon:p[2],action:'page',value:p[0],words:p.join(' ')}));
  for(const n of nodes)result.push({id:'node:'+n.id,title:n.name,detail:`${n.type} · ${n.ms} ms${n.id===S.node?' · 当前节点':''}`,kind:'节点',icon:'network',action:'node',value:n.id,group,words:`节点 切换 代理 ${n.name} ${n.region} ${n.type}`});
  for(const p of S.profiles)result.push({id:'profile:'+p.id,title:p.name,detail:p.active?'当前订阅':'切换到此订阅',kind:'订阅',icon:'folder',action:'profile',value:p.id,words:`订阅 配置 ${p.name}`});
  result.push({id:'action:connect',title:S.proxy||S.tun?'断开连接':'开始连接',detail:S.proxy||S.tun?'关闭系统代理与 TUN':'使用系统代理连接',kind:'操作',icon:'power',action:'connect',words:'连接 断开 开启 关闭 系统代理'});
  if(active)result.push({id:'action:update',title:'更新当前订阅',detail:active.name+' · 查看更新差异后再应用',kind:'操作',icon:'refresh-cw',action:'update',value:active.id,words:'更新订阅 刷新订阅 更新 刷新 订阅 配置 '+active.name});
  result.push({id:'action:diagnostics',title:'检查连接路径',detail:'查看异常环节、检查依据与修复选项',kind:'操作',icon:'stethoscope',action:'diagnostics',words:'诊断 连接 排查 故障 DNS 网络 检查'});
  result.push({id:'action:notifications',title:'打开通知中心',detail:'异常、软件更新与主题消息',kind:'操作',icon:'bell',action:'notifications',words:'通知 更新 提醒 消息'});
  result.push({id:'action:latency',title:'测试当前组延迟',detail:S.group+' · 不改变已选节点',kind:'操作',icon:'gauge',action:'latency',words:'节点 测速 测试 延迟 ping'});
  return result;
}

function nextShellAction(a,v){

  if(a==='nx-select'){nextSelectCommand(v);return true;}
  if(a==='nx-execute'){nextExecuteCommand(v);return true;}
  if(a==='nx-back'){NR.pending=null;nextOpenCommands();return true;}
  if(a==='nx-notifications'){nextOpenNotifications();return true;}
  if(a==='nx-notification-filter'){NR.filter=v==='unread'?'unread':'all';nextOpenNotifications();return true;}
  if(a==='nx-read-all'){NR.notifications.forEach(n=>n.read=true);nextOpenNotifications();save();return true;}
  if(a==='nx-read'){const n=NR.notifications.find(n=>n.id===v);if(n)n.read=true;nextOpenNotifications();save();return true;}
  if(a==='nx-dismiss-alert'){NR.alert=null;nextNotificationChrome();return true;}
  if(a==='nx-notification-open'){const n=NR.notifications.find(n=>n.id===v);if(n){n.read=true;NR.alert=null;save();if(n.action==='go')go(n.value);else if(n.action)nextDispatch(n.action,n.value);else nextOpenNotifications();}return true;}
  if(a==='nx-demo-error'){S.badNode=true;render();nextOpenNotifications();return true;}
  if(a==='nx-demo-resolve'){S.badNode=false;nextResolveNotification('node-error');render();nextOpenNotifications();save();return true;}
  if(a==='nx-demo-update'){nextNotify('software-update','软件更新','有新的公测版本可供查看。下载和安装仍由你确认。','go','updates','info');nextOpenNotifications();save();return true;}

}

function ncRowMarkup(c){return `<article class="nc-record"><div class="nc-record-main"><strong>${h(c.host||c.destination)}</strong><span>${h(c.app)} · ${h(c.protocol)} · ${h(c.destination)}:${c.port}</span><small>命中 ${h(c.matchedRule)} → ${h(c.rule==='DIRECT'?'直连':c.rule)}</small></div><div class="nc-record-rates"><span>↓ ${ncRate(c.downloadBps)}</span><span>↑ ${ncRate(c.uploadBps)}</span></div><div class="nc-record-actions">${ib('info','connection-info','查看连接详情',c.id)}${ib('x','connection-close','关闭这条连接',c.id)}</div></article>`;}
function ncResults(){const n=ncState(),rows=ncFiltered();if(!rows.length)return `<div class="n-empty">${ncRows().length?'没有符合筛选条件的活动连接。':'暂无活动连接。新连接建立后会出现在这里。'}</div>`;if(n.view==='individual')return rows.map(ncRowMarkup).join('');return ncGroups(rows,n.view).map(([label,items])=>{const key=n.view+':'+label,t=ncTotals(items),expanded=n.expanded.includes(key);return `<section class="nc-group"><button type="button" class="nc-group-head cursor-interaction" data-action="nc-expand" data-value="${h(key)}" aria-expanded="${expanded}"><span class="nc-group-title">${icon(expanded?'chevron-down':'chevron-right')}${icon(n.view==='app'?(label==='未识别应用'?'circle-help':'app-window'):'globe')}<span><strong>${h(label)}</strong><small>${t.count} 条连接${label==='未识别应用'?' · 未获得进程信息':''}</small></span></span><span class="nc-group-rates"><span>↓ <strong>${ncRate(t.download)}</strong></span><span>↑ <strong>${ncRate(t.upload)}</strong></span></span><span class="nc-group-routes">代理 ${t.proxy}<br>直连 ${t.direct}</span></button>${expanded?`<div class="nc-group-children">${items.map(ncRowMarkup).join('')}</div>`:''}</section>`;}).join('');}

function ncRefreshConnections(){const r=document.getElementById('navio-next-preview');const list=r?.querySelector('#nc-results'),status=r?.querySelector('#nc-status');if(list)list.innerHTML=ncResults();if(status)status.innerHTML=ncStatus();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function ncConnectionDetail(id){const c=ncRows().find(x=>String(x.id)===String(id));if(!c){toast('这条连接已结束。');return;}openModal('连接详情',row('应用',h(c.app),'')+row('进程',h(c.process||'未获得进程信息'),'')+row('目标网站',h(c.host||'未识别域名'),'')+row('目标地址',h(c.destination)+':'+c.port,badge(c.protocol))+row('来源地址',h(c.sourceIP)+':'+(51941+Number(c.id)),'')+row('命中规则',h(c.matchedRule),'')+row('出站链路',c.rule==='DIRECT'?'DIRECT · 直连':h(c.rule)+' → '+h(nodes.find(n=>n.id===S.node)?.name||'香港 01'),'')+row('当前速率','↓ '+ncRate(c.downloadBps)+' · ↑ '+ncRate(c.uploadBps),'')+row('本连接累计','↓ '+ncBytes(c.downloadBytes)+' · ↑ '+ncBytes(c.uploadBytes),'')+note('这里显示当前活动连接，不作为网站访问历史保存。'),btn('关闭连接','nc-close-detail',c.id,'danger')+btn('返回','close'));}
function ncHistoricalRange(){const n=ncState();let from=NC_TODAY;if(n.period==='week'){const d=ncDate(NC_TODAY),day=d.getUTCDay()||7;from=ncDay(NC_TODAY,1-day);}else if(n.period==='month')from=NC_TODAY.slice(0,8)+'01';else if(n.period==='custom')from=n.from;return{from,to:n.period==='custom'?n.to:NC_TODAY};}
function ncRangeLabel(){const r=ncHistoricalRange();return r.from===r.to?r.from:r.from+' — '+r.to;}
function ncIsLive(){return['host','sourceIP'].includes(OB.view);}
function ncSeedDaily(){const n=ncState(),range=ncHistoricalRange(),rows=[];if(n.cleared)return rows;let start=range.from>n.summaryCutoff?range.from:n.summaryCutoff;const end=range.to<NC_TODAY?range.to:NC_TODAY;let id=0;for(let date=start;date<=end;date=ncDay(date,1)){const day=Math.floor((ncDate(NC_TODAY)-ncDate(date))/86400000),factor=1+((day*7)%9)/10;const seed=[['浏览器','代理',100,1540,302],['播放器','代理',24,400,48],['微信','直连',36,156,185],['系统服务','直连',6,92,32],['开发工具','代理',18,52,63]];for(const[process,outbound,upload,download,count]of seed)rows.push({id:id++,date,process,outbound:outbound==='直连'?'DIRECT':'代理节点',host:'',sourceIP:'',upload:Math.round(upload*factor*1e6),download:Math.round(download*factor*1e6),count:Math.round(count*factor),summary:date<n.detailCutoff});}return rows;}
function ncTrafficData(){
  const q=OB.trafficQuery.trim().toLowerCase();
  if(ncIsLive())return ncRows().map((c,i)=>({id:i,date:NC_TODAY,process:c.app,host:c.host||'未识别域名',sourceIP:c.sourceIP,outbound:c.rule==='DIRECT'?'DIRECT':'代理节点',upload:c.uploadBytes,download:c.downloadBytes,count:1,connectionId:c.id,summary:false})).filter(r=>(OB.routeFilter==='all'||(OB.routeFilter==='direct')===(r.outbound==='DIRECT'))&&(!q||[r.host,r.process,r.outbound,r.sourceIP].some(v=>v.toLowerCase().includes(q))));
  const rows=ncSeedDaily().filter(r=>(OB.routeFilter==='all'||(OB.routeFilter==='direct')===(r.outbound==='DIRECT'))&&(!q||(!r.summary&&[r.process,r.outbound].some(v=>v.toLowerCase().includes(q)))));
  if(OB.view!=='outbound')return rows;
  const archived=new Map(),details=[];
  for(const r of rows){
    if(!r.summary){details.push(r);continue;}
    const key=r.date+'|'+r.outbound;
    if(!archived.has(key))archived.set(key,{...r,process:'每日汇总',upload:0,download:0,count:0,summary:false,archived:true});
    const a=archived.get(key);a.upload+=r.upload;a.download+=r.download;a.count+=r.count;
  }
  return [...details,...archived.values()];
}
function ncDailySeries(data){const m=new Map();for(const r of data){if(!m.has(r.date))m.set(r.date,{upload:0,download:0,count:0,label:r.date.slice(5).replace('-','/'),date:r.date});const p=m.get(r.date);p.upload+=r.upload;p.download+=r.download;p.count+=r.count;}return[...m.values()].sort((a,b)=>a.date.localeCompare(b.date));}
function ncTrafficSeries(data){
  const daily=ncDailySeries(data);if(daily.length!==1||daily[0].date!==NC_TODAY)return daily;
  const source=S.workspaceChart?.dayRows||[[0,0,0],[120,32,3],[240,118,14],[360,290,38],[480,910,68],[600,1560,140],[604,1604,145],[608,1685,150],[612,1810,157],[616,1900,165],[620,2078,173],[624,2240,184]];
  const cumulative=Array.from({length:13},(_,i)=>{const x=source.at(-1)[0]*i/12;let left=source[0],right=source.at(-1);for(let j=1;j<source.length;j++)if(source[j][0]>=x){left=source[j-1];right=source[j];break;}const f=right[0]===left[0]?0:(x-left[0])/(right[0]-left[0]);return[x,left[1]+(right[1]-left[1])*f,left[2]+(right[2]-left[2])*f];});
  const total=daily[0],last=cumulative.at(-1),out=[];let usedUpload=0,usedDownload=0,usedCount=0;
  cumulative.forEach((p,i)=>{const prior=cumulative[Math.max(0,i-1)],final=i===cumulative.length-1;const upload=final?total.upload-usedUpload:Math.round(total.upload*(p[2]-prior[2])/Math.max(1,last[2]));const download=final?total.download-usedDownload:Math.round(total.download*(p[1]-prior[1])/Math.max(1,last[1]));const count=final?total.count-usedCount:Math.round(total.count*((p[1]+p[2])-(prior[1]+prior[2]))/Math.max(1,last[1]+last[2]));usedUpload+=upload;usedDownload+=download;usedCount+=count;out.push({date:NC_TODAY,label:String(Math.floor(p[0]/60)).padStart(2,'0')+':'+String(p[0]%60).padStart(2,'0'),upload,download,count});});
  return out;
}
function ncTrafficRankings(data){const list=obAggregate(data.filter(r=>!r.summary),OB.view),total=obSum(data.filter(r=>!r.summary)).total;return `<section class="ob-ranking"><div class="ob-sectionhead"><h3>${obViewNames[OB.view]}排行</h3><span class="n-muted">${list.length} 项</span></div>${list.map((r,i)=>`<button type="button" class="ob-rank cursor-interaction" data-action="ob-rank" data-value="${h(r.label)}" aria-pressed="${OB.selectedRank===r.label}"><span class="ob-ranktop"><span>${i+1}. ${h(r.label==='DIRECT'?'直连':r.label)}</span><strong>${obBytes(r.total)}</strong></span><span class="ob-rankmeta">↑ ${obBytes(r.upload)} <span>↓ ${obBytes(r.download)}</span></span><span class="ob-ranktrack"><span style="width:${total?r.total/total*100:0}%"></span></span></button>`).join('')||'<div class="n-empty">当前范围没有可用明细</div>'}${data.some(r=>r.summary)?`<p class="nc-retention-note">${ncState().detailCutoff} 之前只保留每日汇总，不列入应用排行。</p>`:''}</section>`;}
function ncTrafficDetail(data){if(!OB.selectedRank)return note(ncIsLive()?'点击排行查看当前连接；这些内容不存入历史。':'点击排行查看按日汇总的应用与出站流量。');const subset=data.filter(r=>!r.summary&&r[OB.view]===OB.selectedRank);if(!subset.length)return note('当前筛选下没有这项明细。');if(ncIsLive())return panel(h(OB.selectedRank),subset.map(r=>row(h(r.process+' · '+(r.host==='未识别域名'?r.sourceIP:r.host)),`↑ ${obBytes(r.upload)} · ↓ ${obBytes(r.download)} · ${r.outbound==='DIRECT'?'直连':'代理'}`,btn('当前连接详情','connection-info',r.connectionId))).join(''));const groups=ncDailySeries(subset),total=obSum(subset);return `<section class="ob-detail"><div class="ob-sectionhead"><div><h3>${h(OB.selectedRank==='DIRECT'?'直连':OB.selectedRank)}</h3><p class="n-muted">${total.count} 次会话 · ${obBytes(total.total)} · 按日聚合</p></div>${btn('收起明细','ob-rank',OB.selectedRank)}</div><div class="nc-daily-list">${groups.map(r=>`<button type="button" class="nc-daily-row cursor-interaction" data-action="nc-stat-detail" data-value="${r.date}"><span>${r.date}</span><span>↓ ${obBytes(r.download)}</span><span>↑ ${obBytes(r.upload)}</span>${icon('chevron-right')}</button>`).join('')}</div></section>`;}
function ncTrafficResults(){const data=ncTrafficData(),range=ncHistoricalRange(),today=range.from===NC_TODAY&&range.to===NC_TODAY;return `<div class="ob-trafficgrid">${ncTrafficRankings(data)}<section class="ob-chartpanel"><div class="ob-sectionhead"><h3>${ncIsLive()?'当前连接累计':today?'今日流量':'每日流量'}</h3>${ncIsLive()?'':'<div class="ob-chartlegend"><span><i class="ob-rx"></i>下载</span><span><i class="ob-tx"></i>上传</span></div>'}</div>${ncIsLive()?`<p class="nc-retention-note">只统计当前仍在连接的请求，连接结束后不再列出。</p>${obAggregate(data,'process').map(r=>row(h(r.label),`${r.count} 条活动连接 · ↑ ${obBytes(r.upload)} · ↓ ${obBytes(r.download)}`,'')).join('')||'<div class="n-empty">暂无活动连接</div>'}`:`<div id="ob-chart" class="ob-chart" role="img" aria-label="所选日期的上传和下载流量"></div><p class="ob-chartcaption">${today?'每点为上一时点之后产生的流量':'按日汇总'}；各段合计与上方统计一致。</p>`}</section></div><div id="ob-traffic-detail">${ncTrafficDetail(data)}</div>`;}
function ncInstallTraffic(){if(ncTrafficInstalled)return;ncTrafficInstalled=true;ncState();obTrafficData=ncTrafficData;obSeries=ncTrafficSeries;obTrafficRankings=ncTrafficRankings;obTrafficDetail=ncTrafficDetail;obTrafficResults=ncTrafficResults;obViewNames.process='应用';Object.assign(obRanges,{today:'今日',week:'本周',month:'本月',custom:'自选时间'});OB.view='process';OB.range=ncState().period;}

function nextConnectionsAction(action,value,el){

  if(action==='connections-clear'){openModal('关闭全部活动连接',note('当前 '+ncRows().length+' 条连接将中断，应用可能重新建立连接。此操作不会删除已保存的应用明细或每日汇总。'),btn('取消','close')+btn('关闭全部连接','connections-clear-confirm','','danger'));return true;}
  if(action==='connections-clear-confirm'){S.connections=[];closeModal();return true;}

function ndState(){
 if(!S.nextDiagnostics)S.nextDiagnostics={version:1,epoch:0,policy:'',sequence:0,events:[],checkedAt:null,eventsExpanded:false,detailId:null,example:null,scenario:'normal',process:'Browser.exe',domain:'docs.example.com',result:null,pendingFix:null};

function ndSelected(){const b=bpState();return [...bpCatalogue.filter(a=>b.selected.includes(a.id)).map(a=>bpApp(a.id)),...b.custom.filter(a=>a.enabled)].filter(a=>a.processes.length||a.domains.length);}
function ndHash(value){let hash=2166136261;for(const c of value){hash^=c.charCodeAt(0);hash=Math.imul(hash,16777619);}return (hash>>>0).toString(16);}
function ndPolicy(){return ndHash(JSON.stringify([S.mode,bpState().enabled,!!S.proxy,!!S.tun,ndSelected().map(a=>[a.id,a.processes,a.domains])]));}
function ndSync(){const d=ndState(),policy=ndPolicy();if(d.policy!==policy){d.policy=policy;d.epoch++;d.checkedAt=null;}return d;}
function ndTime(at){return new Date(at).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function ndNotify(id,title,body,action,value,severity='info'){if(typeof nextNotify==='function')nextNotify(id,title,body,action,value,severity);}
function ndMatch(process,domain){
 const p=String(process||'').trim().toLowerCase(),host=String(domain||'').trim().toLowerCase().replace(/\.$/,'');
 for(const item of ndSelected()){
  const processRule=item.processes.find(value=>p&&value.toLowerCase()===p);
  if(processRule)return {itemId:item.id,itemName:item.name,ruleType:'PROCESS-NAME',ruleValue:processRule};
  const domainRule=item.domains.find(value=>{const suffix=value.toLowerCase().replace(/^\*\./,'').replace(/\.$/,'');return host&&(host===suffix||host.endsWith('.'+suffix));});
  if(domainRule)return {itemId:item.id,itemName:item.name,ruleType:'DOMAIN-SUFFIX',ruleValue:domainRule};
 }
 return null;
}
function ndRoute(request){
 if(!(S.proxy||S.tun)||request.enteredCore===false)return {outbound:'NO-CORE',match:null,reason:'此示例请求未进入内核'};
 if(S.mode==='direct')return {outbound:'DIRECT',match:null,reason:'直连模式，不使用全局例外'};
 if(S.mode==='rule'){
  const host=request.domain.toLowerCase(),rule=(S.rules||[]).find(r=>r.type==='DOMAIN-SUFFIX'&&(host===String(r.value).toLowerCase()||host.endsWith('.'+String(r.value).toLowerCase())))||(S.rules||[]).find(r=>r.type==='MATCH');
  return {outbound:rule?.target==='DIRECT'?'DIRECT':'PROXY',match:null,reason:rule?`${rule.type} · ${rule.value} → ${rule.target}`:'按原有规则分流；不使用全局例外'};
 }
 const match=bpState().enabled?ndMatch(request.process,request.domain):null;
 return {outbound:match?'DIRECT':'PROXY',match,reason:match?'命中选定的全局例外':bpState().enabled?'未匹配所选例外，使用全局策略':'例外未启用，使用全局策略'};
}
function nextBypassMatchStatus(){

 const matches=eligible?events.filter(e=>e.current&&e.mode==='global'&&e.enteredCore&&e.outbound==='DIRECT'&&e.itemId&&ndMatch(e.process,e.domain)?.itemId===e.itemId&&Date.now()-e.at<600000):[];
 const lastMatch=matches[0]||null,status=!eligible?'disabled':lastMatch?'matched':'waiting';
 const label=status==='matched'?'最近匹配到直连':status==='waiting'?'等待匹配流量':bpState().enabled&&S.mode!=='global'?'本模式未启用':'未启用';
 const detail=!bpState().enabled?'总开关已关闭，已选项目保持不变。':S.mode!=='global'?`${S.mode==='rule'?'规则':'直连'}模式不使用全局例外，原有路由保持不变。`:!config.selectedCount?'尚未选择应用或网站。':!(S.proxy||S.tun)?'尚未接入内核；选中项目不代表已有流量命中。':lastMatch?`${ndTime(lastMatch.at)} · ${lastMatch.process||lastMatch.domain} 命中 ${lastMatch.ruleType}，出站为 DIRECT（示例）。`:'配置已就绪，尚未观察到当前配置下的例外命中。';
 return {id:'bypass-match',status,label,detail,eligible,selectedCount:config.selectedCount,configuredCount:eligible?config.selectedCount:0,matchedCount:new Set(matches.map(e=>e.itemId)).size,lastMatch,events};
}

if(a==='go')go(v);else if(a==='close')dismissModal();else if(a==='collapse'){S.collapsed=!S.collapsed;render();save();}else if(a==='group'){const k=v==='config'?'groupConfig':'groupNetwork';S[k]=!S[k];go(v==='config'?'configGroup':'networkGroup');}else if(a==='search')openSearch();else if(a==='connect'){if(S.proxy||S.tun){S.proxy=false;S.tun=false;}else S.proxy=true;render();toast(S.proxy?'系统代理已开启（模拟）':'已断开连接（模拟）');}else if(a==='mode'){S.mode=v;render();save();}else if(a==='interface'){openModal('界面模式',note('两种模式使用相同配置。简易模式收起高级选项，需要时仍可展开。'),btn('简易模式','interface-set','simple')+btn('标准模式','interface-set','standard','primary'));}else if(a==='interface-set'){S.interfaceMode=v;if(v==='simple'){S.groupConfig=false;S.groupNetwork=false;}closeModal();toast('已切换界面模式，配置未改变。');}else if(a==='node-drawer')nodeDrawer();else if(a==='proxy-group'){S.group=v;if(!M.members[v].includes(S.node))S.node=M.members[v][0];render();}else if(a==='node-pick'){S.node=v;S.badNode=false;if(S.modal?.type==='nodes')closeModal();else render();toast('已选择 '+nodes.find(n=>n.id===v).name+'（模拟）');}else if(a==='favorite'){S.favorite=S.favorite.includes(v)?S.favorite.filter(x=>x!==v):[...S.favorite,v];updateNodeList();}else if(a==='node-filter'){S.onlyFavorites=!S.onlyFavorites;if(S.modal?.type==='nodes')nodeDrawer();else render();}else if(a==='node-test'){S.tested=true;toast('测速完成，当前策略组 '+M.members[S.group].length+' 个节点可用（模拟）。');updateNodeList();}else if(a==='node-fail'){S.badNode=true;render();}else if(a==='recommend'){const n=nodes.filter(n=>n.id!==S.node&&M.members[S.group].includes(n.id)).sort((a,b)=>(S.favorite.includes(b.id)-S.favorite.includes(a.id))||a.ms-b.ms)[0];if(!n){toast('当前策略组没有其他可用节点。');return;}openModal('更换不可用节点',row(n.name,S.favorite.includes(n.id)?'当前策略组中的可用收藏节点':'当前策略组中延迟最低的可用节点',badge(n.ms+' ms'))+note('切换后，出口 IP 或地区可能改变。当前节点会保留在列表中。'),btn('暂不更换','close')+btn('切换到此节点','recommend-confirm',n.id,'primary'));}else if(a==='recommend-confirm'){S.node=v;S.badNode=false;closeModal();toast('节点已切换（模拟）。');}else if(a==='strategy'){openModal('策略组设置',selectField('类型','strategyType',S.cfg.strategyType||'select',[['select','手动选择'],['url-test','自动选择'],['fallback','故障转移'],['load-balance','负载均衡']])+field('测速间隔（秒）','strategyInterval',S.cfg.strategyInterval||300,'number')+note('策略组设置保存为本地覆写。'),btn('保存','settings-save','','primary'));}
else if(a==='profile-add'){S.profileDraft='新订阅';openModal('导入订阅',field('名称','profileDraft',S.profileDraft)+field('订阅地址（示例）','profileUrl','https://subscription.example.com/demo')+note('原型使用示例地址；不请求实际订阅。'),btn('从文件导入示例','profile-import-file')+btn('导入','profile-import','','primary'));}else if(a==='profile-import'||a==='profile-import-file'){S.profiles.push({id:'p'+(++S.profileCounter),name:S.profileDraft||'导入的配置',active:false});closeModal();toast('示例订阅已加入列表。');}else if(a==='profile-use'){S.profiles.forEach(p=>p.active=p.id===v);render();toast('配置已切换（模拟）。');}else if(a==='profile-edit')profileEdit(v);else if(a==='profile-save'){if(!S.editorText.includes(':')){toast('配置缺少有效的 YAML 字段，请检查内容。');return;}S.profiles.find(x=>x.id===v).overlayText=S.editorText;closeModal();toast('配置检查通过，修改已保存为本地覆写（模拟）。');}else if(a==='profile-update'){openModal('订阅更新差异',row('节点','新增 新加坡 02；移除 美国 03。',badge('+1 / −1'))+row('规则冲突','订阅与本地修改都改变了 example.cn 的去向。',badge('需处理'))+selectField('冲突处理','conflictChoice',S.cfg.conflictChoice||'local',[['local','保留本地直连规则'],['remote','使用订阅规则'],['review','暂缓，稍后处理']])+note('确认前继续使用当前配置。'),btn('取消','close')+btn('应用更新','profile-update-confirm',v,'primary'));}else if(a==='profile-update-confirm'){if(S.cfg.conflictChoice==='review'){closeModal();toast('已暂缓更新，继续使用原配置。');}else{closeModal();toast('订阅已更新，本地修改已按选择合并（模拟）。');}}else if(a==='profile-more'){openModal('订阅操作',row('自动更新','间隔 6 小时',toggle('profileAuto','自动更新'))+row('导出','选择是否包含订阅地址与节点凭据。',btn('导出选项','profile-export'))+row('移除订阅','只移除本机配置。',btn('移除','profile-remove',v,'danger')));}else if(a==='profile-export'){openModal('导出配置',selectField('导出内容','profileExport','redacted',[['redacted','脱敏配置'],['complete','完整配置，包含凭据']])+note('原型不会导出真实凭据。'),btn('生成示例导出','profile-export-confirm','','primary'));}else if(a==='profile-export-confirm'){closeModal();toast('已生成示例导出，不写入磁盘。');}else if(a==='profile-remove'){if(S.profiles.find(x=>x.id===v)?.active){toast('请先切换到另一份配置，再移除当前配置。');return;}S.profiles=S.profiles.filter(x=>x.id!==v);closeModal();}
else if(a==='connection-close'){S.connections=S.connections.filter(x=>x.id!==+v);render();}else if(a==='connections-clear'){openModal('关闭全部连接',note('现有请求会中断，应用可能重新建立连接。'),btn('取消','close')+btn('关闭全部','connections-clear-confirm','','danger'));}else if(a==='connections-clear-confirm'){S.connections=[];closeModal();}else if(a==='connection-info'){const c=S.connections.find(x=>x.id===+v);openModal('连接详情',row('应用',c.app,'')+row('目标',c.host,'')+row('链路','节点选择 → '+nodes.find(n=>n.id===S.node).name,'')+row('协议','TCP · TLS','')+row('源地址','192.0.2.10:52816（示例）',''));}
else if(a==='bypass-add'){openModal('添加全局例外',selectField('类型','bypassType',S.cfg.bypassType||'进程名',[['进程名','应用进程'],['域名后缀','网站域名']])+field('匹配内容','bypassValue',S.cfg.bypassValue||'Example.exe')+note('仅在全局模式生效。'),btn('添加','bypass-save','','primary'));}else if(a==='bypass-save'){S.customBypass||=[];S.customBypass.push({type:S.cfg.bypassType||'进程名',value:S.cfg.bypassValue||'Example.exe'});closeModal();}else if(a==='bypass-remove'){S.customBypass.splice(+v,1);render();}else if(a==='rule-add')ruleForm();else if(a==='rule-edit')ruleForm(+v);else if(a==='rule-save'){const d=S.draftRule;if(!d.value.trim()){toast('请填写匹配内容。');return;}if(d.index===undefined)S.rules.unshift({type:d.type,value:d.value,target:d.target});else S.rules[d.index]={type:d.type,value:d.value,target:d.target};closeModal();}else if(a==='rule-up'){const i=+v;if(i>0&&S.rules[i].type!=='MATCH')[S.rules[i-1],S.rules[i]]=[S.rules[i],S.rules[i-1]];render();}else if(a==='rule-test'){openModal('测试规则',field('目标域名','testDomain',S.cfg.testDomain||'www.example.cn'),btn('测试','rule-test-result','','primary'));}else if(a==='rule-test-result'){const d=S.cfg.testDomain||'www.example.cn';const r=S.rules.find(r=>r.type==='MATCH'||r.type==='DOMAIN-SUFFIX'&&(d===r.value||d.endsWith('.'+r.value))||r.type==='DOMAIN'&&d===r.value)||S.rules.find(r=>r.type==='MATCH');openModal('匹配结果',row(h(d),r?`${r.type} → ${h(r.target)}`:'未匹配',badge('模拟匹配')),btn('关闭','close'));}
else if(a==='traffic-range'){S.trafficRange=v;render();}else if(a==='traffic-export'){openModal('导出用量记录',selectField('格式','trafficFormat','csv',[['csv','CSV'],['json','JSON']])+note('包含日期、应用名称、节点名称与流量统计，不包含连接内容。'),btn('生成示例记录','traffic-export-confirm','','primary'));}else if(a==='traffic-export-confirm'){closeModal();toast('已生成示例记录，不写入磁盘。');}else if(a==='traffic-settings'){openModal('记录设置',selectField('保留周期','trafficKeep','30',[['7','7 天'],['30','30 天'],['90','90 天']])+row('旧版数据库','检查并导入 CFW 历史流量。',btn('检查示例','traffic-import')),btn('保存','settings-save','','primary'));}else if(a==='traffic-import'){openModal('旧记录导入',note('检查通过：示例数据库包含 28 天流量记录。'),btn('导入','settings-save','','primary'));}else if(a==='log-pause'){S.logPaused=!S.logPaused;render();}else if(a==='log-clear'){S.logs=[];render();}else if(a==='log-export'){openModal('导出日志',note('已脱敏订阅地址和令牌，包含内核版本、时间与错误内容。'),btn('确认导出示例','traffic-export-confirm','','primary'));}else if(a==='diagnostics'){openModal('诊断结果',row('配置语法','通过',badge('正常'))+row('内核控制接口','连接成功',badge('正常'))+row('系统代理','端口 7890 可用',badge('正常'))+row('外部连接','示例检查通过',badge('正常')),btn('关闭','close'));}else if(a==='settings-save'){closeModal();toast('设置已保存到本次模拟。');}else if(a==='tray'){openModal('已收起到系统托盘',note('Navio 保持运行，连接不会中断。点击托盘图标可以恢复窗口。')+row('托盘状态',S.proxy?'青色标记 · 系统代理开启':'灰色标记 · 系统代理关闭',badge(S.proxy?'已连接':'未连接')),btn('模拟恢复窗口','close','','primary'));}else if(a==='pin'){S.cfg.pin=!S.cfg.pin;toast(S.cfg.pin?'窗口置顶已开启（模拟）。':'窗口置顶已关闭（模拟）。');}else if(!advancedAction(a,v,b))extrasAction(a,v,b);});
root.addEventListener('input',e=>{const el=e.target,k=el.dataset.field;if(!k)return;const v=el.type==='checkbox'?el.checked:el.value;if(nextField(k,v,el))return;if(integratedBypassField(k,v,el))return;if(fxThemeField(k,v,el))return;if(workspaceChartField(k,v,el)||galleryField(k,v,el))return;if(revisionField(k,v,el)||observabilityField(k,v,el)||bypassField(k,v,el)||motionField(k,v,el))return;if(k==='nodeQuery'){S.nodeQuery=v;updateNodeList();}else if(k==='globalSearch'){S.search=v;root.querySelector('#n-search-results').innerHTML=searchContent();}else if(k==='connectionQuery'){S.connectionQuery=v;root.querySelector('#n-connections').innerHTML=connectionsTable(filteredConnections());if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}else if(k==='profileDraft'||k==='editorText')S[k]=v;else if(k.startsWith('draftRule.'))S.draftRule[k.split('.')[1]]=v;else if(!moreField(k,v,el)&&!advancedField(k,v,el)&&!extrasField(k,v,el))S.cfg[k]=v;});
root.addEventListener('change',e=>{const el=e.target,k=el.dataset.field,v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.bypass){const n=el.dataset.bypass;S.bypass=el.checked?[...new Set([...S.bypass,n])]:S.bypass.filter(x=>x!==n);render();}else if(k==='proxy'){S.proxy=el.checked;render();}else if(k==='tun'){if(el.checked){go('tun');advancedAction('adv-tun-enable','',el);}else{S.tun=false;render();}}else if(k==='group'){S.group=v;if(!M.members[v].includes(S.node))S.node=M.members[v][0];if(S.modal?.type==='nodes')nodeDrawer();else render();}else if(k==='logLevel'){S.logLevel=v;render();}});
root.addEventListener('keydown',e=>{if(nextShellKeydown(e))return;if(e.key==='Escape'&&S.modal){e.preventDefault();dismissModal();}if(e.key==='Tab'&&S.modal){const els=[...root.querySelectorAll('.n-dialog button:not([disabled]),.n-dialog input:not([disabled]),.n-dialog select:not([disabled]),.n-dialog textarea:not([disabled])')].filter(x=>x.getClientRects().length);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}});
S.page='themes';motionInit();if(saved?.version===9&&['liquid','glass','solid'].includes(saved.material))RV.material=saved.material;if(saved?.version===9&&saved.motion)S.motion={...S.motion,...saved.motion};if(saved?.version===9){workspaceRestoreDesign(saved);nextRestore(saved);}render();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();save();}});t.addSelect(S,'appearance',{label:'明暗外观',options:[{value:'dark',label:'深色'},{value:'light',label:'浅色'},{value:'system',label:'跟随系统'}]});t.addSelect(S,'density',{label:'显示密度',options:[{value:'balanced',label:'均衡'},{value:'spacious',label:'舒展'},{value:'compact',label:'紧凑'}]});}
window.addEventListener('openai:set_globals',e=>{const x=e.detail?.globals?.widgetState?.privateContent;if(x?.version!==9)return;let changed=false;for(const k of ['appearance','accent','density','collapsed'])if(x[k]!==undefined&&S[k]!==x[k]){S[k]=x[k];changed=true;}if(['liquid','glass','solid'].includes(x.material)){RV.material=x.material;changed=true;}if(x.motion){S.motion={...S.motion,...x.motion};changed=true;}if(x.gallery||x.bypass){workspaceRestoreDesign(x);changed=true;}if(x.nextShell||x.nextThemes||x.nextDiagnostics||x.nextConnections){nextRestore(x);changed=true;}if(changed)render();});
