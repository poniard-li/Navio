name: 功能建议
description: 提出一个使用场景或改进建议
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题？
      description: 请描述实际使用场景、当前操作和遇到的困难。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望软件怎样处理？
      description: 可以描述期望行为、示例或其他可行方式。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他补充
      description: 可选。不要提交订阅凭据或真实账号资料。
