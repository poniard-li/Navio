name: 功能请求
description: '提出 Navio 功能或交互改进建议'
title: '[Feature] '
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: 提交前确认
      description: 请先查看已有建议，相关问题可在原 Issue 中补充。
      options:
        - label: 我已搜索已有 Issue，未找到相同建议

  - type: dropdown
    attributes:
      label: 操作系统
      description: 请提供操作系统类型
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    attributes:
      label: 使用场景与建议
      description: 说明目前遇到的困难、希望如何操作，以及预期结果。
    validations:
      required: true
