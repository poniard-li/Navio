name: 错误反馈
description: '报告 Navio 使用中遇到的问题'
title: '[Bug] '
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: 提交前确认
      description: 请先搜索已有问题，并移除截图、日志中的账号、订阅链接和访问凭据。
      options:
        - label: 我已搜索已有 Issue，未找到相同问题
        - label: 上传的内容不包含订阅链接、密码、令牌或验证码

  - type: dropdown
    attributes:
      label: 操作系统
      description: 请提供操作系统类型
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    attributes:
      label: 系统版本
      description: 请提供出现问题的操作系统版本
    validations:
      required: true
  - type: input
    attributes:
      label: Navio 版本
      description: 可在“关于”中查看完整版本号。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望结果与实际情况
      description: 说明原本希望完成什么，以及实际出现的现象或错误信息。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 按操作顺序列出步骤。无法稳定复现时，请说明出现频率及触发条件。
    validations:
      required: true
