name: Cloud handoff source checks
on:
  push:
    branches:
      - 'codex/cloud-handoff-*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Check Bash entry point
        if: runner.os == 'Linux'
        shell: bash
        run: bash -n scripts/cloud/setup.sh
      - name: Install source dependencies
        run: node scripts/cloud/setup.mjs
      - name: Check source and compile
        run: node scripts/cloud/check.mjs
